# Blueprint do Render (https://render.com/docs/blueprint-spec).
# No dashboard: New + -> Blueprint -> selecione este repositório.
# O Render lê este arquivo e cria o serviço abaixo automaticamente.
services:
  - type: web
    name: cards-against-friends
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      # sync: false = o Render pede pra você colar o valor na hora de criar o
      # Blueprint, sem guardar o segredo neste arquivo. Pegue os valores em
      # Project Settings -> API no seu projeto Supabase. Sem eles, o app
      # funciona normalmente — só o Hall da Fama fica desativado.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
